name: silah_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ─── Core SDK & Icons ───
  cupertino_icons: ^1.0.8 # iOS-style icons for Cupertino widgets
  material_color_utilities: 0.13.0 # Material Design color utilities (pinned for SDK compatibility)

  # ─── State Management ───
  flutter_bloc: # BLoC pattern for state management (Events → States)
  equatable: # Value equality for BLoC states/events (avoids boilerplate ==)
  rxdart: # Reactive extensions for Dart streams (advanced stream operators)

  # ─── Architecture & Dependency Injection ───
  get_it: # Service locator for dependency injection
  dartz: # Functional programming (Either, Option) for error handling

  # ─── Networking & API ───
  dio: ^5.8.0+1 # HTTP client for REST API calls
  dio_http2_adapter: ^2.6.0 # HTTP/2 adapter for Dio (improved performance)
  retrofit: ^4.9.0 # Type-safe REST client generator (works with Dio)
  connectivity_plus: # Detect network connectivity status (WiFi, mobile, none)
  pull_to_refresh: # Pull-to-refresh and load-more list functionality

  # ─── Firebase ───
  firebase_core: # Core Firebase SDK (required by all Firebase services)
  firebase_auth: # Firebase Authentication (sign-in, sign-up, identity)
  cloud_firestore: # Cloud Firestore NoSQL database
  firebase_storage: # Firebase Cloud Storage for file uploads/downloads
  firebase_messaging: # Firebase Cloud Messaging for push notifications
  firebase_crashlytics: ^4.3.7 # Crash reporting and analytics
  # firebase_crashlytics:            # (duplicate — active version above with ^4.3.7)
  flutter_local_notifications: ^19.1.0 # Display local notifications (works with FCM)
  # awesome_notifications:           # Alternative notification package
  # awesome_notifications_fcm:       # FCM integration for awesome_notifications

  # ─── Local Database & Storage ───
  shared_preferences: # Key-value storage for simple settings/preferences
  flutter_secure_storage: ^9.2.4 # Encrypted key-value storage for sensitive data (tokens, etc.)
  path_provider: # Access device file system directories (temp, docs, etc.)
  sqlcipher_flutter_libs: ^0.6.8 # Encrypted SQLite database (SQLCipher) native libraries

  # ─── Routing & Navigation ───
  go_router: ^16.0.0 # Declarative URL-based routing with deep linking support

  # ─── Localization & Internationalization ───
  easy_localization: ^3.0.8 # Multi-language support with JSON/YAML translation files

  # ─── UI Components & Widgets ───
  flutter_svg: # Render SVG images as widgets
  shimmer: # Shimmer loading effect placeholders
  lottie: # Render Lottie JSON animations
  dropdown_button2: ^2.3.9 # Customizable dropdown button widget
  carousel_slider: ^5.0.0 # Image/content carousel slider widget
  introduction_screen: ^3.1.17 # Onboarding / intro screens with step indicators
  wizard_stepper: ^0.0.10 # Multi-step wizard / stepper form widget
  auto_animated: # Automatically animated list/grid items on appear
  skeletonizer: ^2.1.0+1 # Skeleton loading effect (bones placeholder UI)
  awesome_dialog: # Beautiful pre-built alert/confirmation dialogs
  another_flushbar: # Top/bottom snackbar-style notification bars
  dynamic_color: ^1.8.1 # Material You dynamic color theming from wallpaper
  flutter_native_splash: # Native splash screen generator for app startup
  flutter_otp_text_field: # OTP input field with individual digit boxes

  # curved_labeled_navigation_bar:   # Curved bottom navigation bar with labels
  # curved_navigation_bar:           # Curved bottom navigation bar
  # modal_bottom_sheet:              # Custom modal bottom sheet
  # modal_bottom_sheet: ^3.0.0-pre   # (pre-release version)
  # order_tracker:                   # Order tracking stepper widget

  # ─── Media Handling ───
  image_picker: # Pick images from gallery or camera
  image_cropper: # Crop images after selection
  extended_image: ^10.0.1 # Advanced image widget (zoom, pinch, cache, gestures)
  mobile_scanner: ^7.0.0 # QR code and barcode scanner using camera
  # cached_network_image:            # Cache and display network images
  # flutter_datetime_picker:         # Date and time picker widget

  # ─── Web Views ───
  flutter_inappwebview: ^6.1.5 # In-app browser/webview (payment, suggestions, about us)
  url_launcher: # Open URLs, emails, phone calls, and SMS
  # webview_flutter:                 # Alternative webview widget

  # ─── Security & Encryption ───
  encrypt: ^5.0.3 # AES/RSA encryption and decryption
  pointycastle: ^3.9.1 # Cryptographic algorithms (hashing, ciphers, etc.)
  local_session_timeout: ^3.2.0 # Auto-logout after user inactivity timeout
  local_auth: ^2.3.0 # Biometric authentication (fingerprint, face ID)

  # ─── Device & Platform Info ───
  device_info_plus: # Get device hardware/software info (model, OS, etc.)
  package_info_plus: # Get app package info (version, build number, etc.)
  # package_info:                    # (deprecated — replaced by package_info_plus)
  phone_numbers_parser: ^9.0.3 # Parse, validate, and format phone numbers
  uuid: # Generate unique identifiers (UUIDv4)
  #geolocator:                       # Get device GPS location
  #geocoding: ^2.1.0                 # Convert coordinates to addresses and vice versa

  # ─── Serialization & Code Generation ───
  json_annotation: # Annotations for JSON serialization code generation
  freezed_annotation: ^3.1.0 # Annotations for immutable data classes (used by freezed)
  dart_mappable: ^4.6.1 # Data class mapping / serialization framework
  dart_mappable_builder: ^4.6.1 # Build runner plugin for dart_mappable code generation

  # ─── Utilities ───
  logger: any # Pretty-print log messages for debugging
  # restart_app:                     # Programmatically restart the Flutter app
  # android_intent_plus: ^5.3.0      # Launch Android intents from Flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^5.0.0 # Recommended lint rules for Flutter projects

  # ─── Code Generation ───
  build_runner: ^2.10.1 # Runs code generators (freezed, json_serializable, etc.)
  freezed: ^3.1.0 # Code generator for immutable classes, unions, and copyWith
  json_serializable: # Generate toJson/fromJson methods from annotations
  copy_with_extension_gen: # Generate copyWith extension methods
  retrofit_generator: ^10.1.2 # Generate Retrofit API client code from annotations
  drift_dev: ^2.29.0 # Code generator for Drift (reactive SQLite) database
  flutter_gen_runner: # Generate type-safe asset references (run: flutter packages pub run build_runner build)

  # ─── Build & Config Tools ───
  flutter_flavorizr: # Generate build flavors (dev, staging, prod)
  flutter_dotenv: ^5.2.1 # Load environment variables from .env files
  flutter_launcher_icons: "^0.13.1" # Generate platform launcher icons from config
  #flutter_launcher_icons: "^0.9.2"  # (previous version)
  glob: ^2.1.3 # File system glob pattern matching

  # ─── UI & Testing Utilities ───
  flutter_spinkit: # Collection of animated loading indicators
  form_validation: ^3.2.0 # Form field validation helpers

  # ─── Commented Out ───
  # change_app_package_name:         # Rename app package (flutter pub run change_app_package_name:main com.new.package.name)
  # very_good_analysis: ^7.0.0       # Strict Dart analysis rules by Very Good Ventures
  # json_annotation:                 # (already in dependencies)

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo/app_icon_foreground.png"
  remove_alpha_ios: true
  image_path: "assets/icons/logo/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/logo/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icons/logo/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/logo/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - env/.env
    - assets/images/
    - assets/translations/
    - assets/icons/
    - assets/icons/flags/
    - assets/icons/logo/
    - assets/icons/navigation/
    - assets/icons/bottom_navigation/
    - assets/lottie/
    - assets/fonts/cairo/

    # - assets/country/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700

flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.
  # Customize the parameters below, and run the following command in the terminal:
  # dart run flutter_native_splash:create
  # To restore Flutter's default white splash screen, run the following command in the terminal:
  # dart run flutter_native_splash:remove

  # IMPORTANT NOTE: These parameter do not affect the configuration of Android 12 and later, which
  # handle splash screens differently that prior versions of Android.  Android 12 and later must be
  # configured specifically in the android_12 section below.

  # color or background_image is the only required parameter.  Use color to set the background
  # of your splash screen to a solid color.  Use background_image to set the background of your
  # splash screen to a png image.  This is useful for gradients. The image will be stretch to the
  # size of the app. Only one parameter can be used, color and background_image cannot both be set.
  color: "#3C6F2F"
  #background_image: "assets/background.png"

  # Optional parameters are listed below.  To enable a parameter, uncomment the line by removing
  # the leading # character.

  # The image parameter allows you to specify an image used in the splash screen.  It must be a
  # png file and should be sized for 4x pixel density.
  image: assets/icons/logo/logo.png

  # The branding property allows you to specify an image used as branding in the splash screen.
  # It must be a png file. It is supported for Android, iOS and the Web.  For Android 12,
  # see the Android 12 section below.
  #branding: assets/dart.png

  # To position the branding image at the bottom of the screen you can use bottom, bottomRight,
  # and bottomLeft. The default values is bottom if not specified or specified something else.
  #branding_mode: bottom

  # The color_dark, background_image_dark, image_dark, branding_dark are parameters that set the background
  # and image when the device is in dark mode. If they are not specified, the app will use the
  # parameters from above. If the image_dark parameter is specified, color_dark or
  # background_image_dark must be specified.  color_dark and background_image_dark cannot both be
  # set.
  #color_dark: "#042a49"
  #background_image_dark: "assets/dark-background.png"
  #image_dark: assets/splash-invert.png
  #branding_dark: assets/dart_dark.png

  # From Android 12 onwards, the splash screen is handled differently than in previous versions.
  # Please visit https://developer.android.com/guide/topics/ui/splash-screen
  # Following are specific parameters for Android 12+.
  android_12:
    # The image parameter sets the splash screen icon image.  If this parameter is not specified,
    # the app's launcher icon will be used instead.
    # Please note that the splash screen will be clipped to a circle on the center of the screen.
    # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
    # 640 pixels in diameter.
    # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
    # 768 pixels in diameter.
    image: "assets/icons/logo/logo.png"

    # Splash screen background color.
    color: "#3C6F2F"

    # App icon background color.
    icon_background_color: "#3C6F2F"

    # App icon background color.
    #icon_background_color: "#111111"

    # The branding property allows you to specify an image used as branding in the splash screen.
    #branding: assets/dart.png

    # The image_dark, color_dark, icon_background_color_dark, and branding_dark set values that
    # apply when the device is in dark mode. If they are not specified, the app will use the
    # parameters from above.
    #image_dark: assets/android12splash-invert.png
    color_dark: "#292929"
    #icon_background_color_dark: "#eeeeee"

  # The android, ios and web parameters can be used to disable generating a splash screen on a given
  # platform.
  android: true
  ios: true
  web: false

  # Platform specific images can be specified with the following parameters, which will override
  # the respective parameter.  You may specify all, selected, or none of these parameters:
  #color_android: "#42a5f5"
  color_dark_android: "#292929"
  #color_ios: "#42a5f5"
  color_dark_ios: "#292929"
  #color_web: "#42a5f5"
  #color_dark_web: "#042a49"
  #image_android: "assets/icons/splash.png"
  #image_dark_android: assets/splash-invert-android.png
  #image_ios: assets/splash-ios.png
  #image_dark_ios: assets/splash-invert-ios.png
  #image_web: assets/splash-web.gif
  #image_dark_web: assets/splash-invert-web.gif
  #background_image_android: "assets/background-android.png"
  #background_image_dark_android: "assets/dark-background-android.png"
  #background_image_ios: "assets/background-ios.png"
  #background_image_dark_ios: "assets/dark-background-ios.png"
  #background_image_web: "assets/background-web.png"
  #background_image_dark_web: "assets/dark-background-web.png"
  #branding_android: assets/brand-android.png
  #branding_dark_android: assets/dart_dark-android.png
  #branding_ios: assets/brand-ios.png
  #branding_dark_ios: assets/dart_dark-ios.png
  #branding_web: assets/brand-web.gif
  #branding_dark_web: assets/dart_dark-web.gif

  # The position of the splash image can be set with android_gravity, ios_content_mode, and
  # web_image_mode parameters.  All default to center.
  #
  # android_gravity can be one of the following Android Gravity (see
  # https://developer.android.com/reference/android/view/Gravity): bottom, center,
  # center_horizontal, center_vertical, clip_horizontal, clip_vertical, end, fill, fill_horizontal,
  # fill_vertical, left, right, start, or top.
  #android_gravity: center
  #
  # ios_content_mode can be one of the following iOS UIView.ContentMode (see
  # https://developer.apple.com/documentation/uikit/uiview/contentmode): scaleToFill,
  # scaleAspectFit, scaleAspectFill, center, top, bottom, left, right, topLeft, topRight,
  # bottomLeft, or bottomRight.
  #ios_content_mode: center
  #
  # web_image_mode can be one of the following modes: center, contain, stretch, and cover.
  #web_image_mode: center

  # The screen orientation can be set in Android with the android_screen_orientation parameter.
  # Valid parameters can be found here:
  # https://developer.android.com/guide/topics/manifest/activity-element#screen
  #android_screen_orientation: sensorLandscape

  # To hide the notification bar, use the fullscreen parameter.  Has no effect in web since web
  # has no notification bar.  Defaults to false.
  # NOTE: Unlike Android, iOS will not automatically show the notification bar when the app loads.
  #       To show the notification bar, add the following code to your Flutter app:
  #       WidgetsFlutterBinding.ensureInitialized();
  #       SystemChrome.setEnabledSystemUIMode(SystemUiMode.manual, overlays: [SystemUiOverlay.bottom, SystemUiOverlay.top], );
  fullscreen: true

  # If you have changed the name(s) of your info.plist file(s), you can specify the filename(s)
  # with the info_plist_files parameter.  Remove only the # characters in the three lines below,
  # do not remove any spaces:
  #info_plist_files:
  #  - 'ios/Runner/Info-Debug.plist'
  #  - 'ios/Runner/Info-Release.plist'
